name: Build ChekaApp Android APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Tengeneza GitHub Release yenye faili la APK na AAB'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Toleo la Release (mfano v3.0.0)'
        required: false
        default: 'v3.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android APK & Google Play AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Web Bundle (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Configure Android Keystore for Signing
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/cheka-release.keystore
          elif [ -f "cheka-release.keystore" ]; then
            echo "Using repository keystore..."
            cp cheka-release.keystore android/app/cheka-release.keystore
          else
            echo "Generating production release keystore..."
            keytool -genkey -v -keystore android/app/cheka-release.keystore -alias "${{ secrets.KEY_ALIAS || 'cheka_key' }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD || 'cheka1234' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'cheka1234' }}" \
              -dname "CN=ChekaApp, OU=Mobile, O=ChekaApp Inc, L=Dar es Salaam, ST=Dar es Salaam, C=TZ"
          fi

      - name: Build Android Release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'cheka1234' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'cheka_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'cheka1234' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Rename Artifacts for Easy Distribution
        run: |
          mkdir -p dist-artifacts
          # Copy APK
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" dist-artifacts/ChekaApp-Release.apk
            echo "APK ready: dist-artifacts/ChekaApp-Release.apk"
          fi
          # Copy AAB
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" dist-artifacts/ChekaApp-Release.aab
            echo "AAB ready: dist-artifacts/ChekaApp-Release.aab"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChekaApp-Release-APK
          path: dist-artifacts/ChekaApp-Release.apk
          if-no-files-found: error

      - name: Upload AAB Bundle Artifact (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ChekaApp-GooglePlay-AAB
          path: dist-artifacts/ChekaApp-Release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ChekaApp ${{ github.event.inputs.release_tag }} Official Android Release
          body: |
            ### 🚀 ChekaApp Android Official Release (${{ github.event.inputs.release_tag }})
            
            **Maboresho na Vipengele vipya:**
            - 🎭 Duet & Video Reaction Studio na kamera/maikrofoni ya simu
            - ⚡ AI Recommendation Engine (For You Feed iliyojengwa kwa hisia na mcheko)
            - 💰 Tanzanian Mobile Money Wallet (M-Pesa, Tigo Pesa, Airtel Money, HaloPesa)
            - 🔔 Push Notifications za papo hapo
            - 🛡️ Gemini AI Content Moderation & Safety Reporting
            
            **Faili za Kusakinisha:**
            - **`ChekaApp-Release.apk`**: Sakinisha moja kwa moja kwenye simu yoyote ya Android.
            - **`ChekaApp-Release.aab`**: Pakia moja kwa moja kwenye Google Play Console.
          files: |
            dist-artifacts/ChekaApp-Release.apk
            dist-artifacts/ChekaApp-Release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
