<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container (Full Bleed for Maskable) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Inner Safe Zone Icon Graphic (within center 80%) -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Laughing Face / Reel Emoji -->
    <!-- Eyes squinting with laughter (Curved Arcs) -->
    <path d="M -110,-45 C -90,-85 -40,-85 -20,-45" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M 20,-45 C 40,-85 90,-85 110,-45" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none"/>
    
    <!-- Big Laughing Open Mouth -->
    <path d="M -115,20 C -115,20 -70,125 0,125 C 70,125 115,20 115,20 Z" fill="#171717"/>
    <!-- Tongue / Cheek expression -->
    <path d="M -45,95 C -25,120 25,120 45,95 C 30,75 -30,75 -45,95 Z" fill="#ef4444"/>
    
    <!-- Video Play badge on the side -->
    <circle cx="95" cy="80" r="32" fill="#ffffff"/>
    <polygon points="90,70 106,80 90,90" fill="#ec4899"/>
  </g>
</svg>
